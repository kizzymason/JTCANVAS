upstream infinite_canvas_api {
    server api:4000;
    keepalive 32;
}

# Behind the host TLS proxy the inner $scheme is http; keep the original proto when present.
map $http_x_forwarded_proto $pass_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust only loopback/private reverse proxies to restore the real client address. Direct public
    # callers cannot forge X-Forwarded-For, while a host-level TLS proxy still preserves the client IP.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 画布数据是较大的 JSON，放宽请求体上限；文件上传另有单独限制。
    client_max_body_size 60m;

    # Hashed filenames change every deploy. Missing /assets/* must not fall back to the SPA
    # index (that would be 200 text/html and break module scripts). Serve a refresh prompt instead.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 =404 /page-updated.html;
        try_files $uri =404;
    }

    # Brand imagery is shared by every visit to the homepage; keep it in the
    # browser cache across route changes and allow stale-while-revalidate.
    location ^~ /brand/gravity/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000";
        try_files $uri =404;
    }

    location = /page-updated.html {
        add_header Cache-Control "no-store";
        default_type text/html;
    }

    # Stable chrome marks are versioned in their HTML/CSS references and reused across route changes.
    location = /logo.svg {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://infinite_canvas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace rather than append: API-key IP allowlists must not trust a client-supplied first hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $pass_proto;
        proxy_set_header X-Request-Id $request_id;

        # 文本生成走 SSE，必须关掉缓冲，否则增量会被攒到最后一次性下发。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 视频任务可能跑很久，读超时按最长任务放宽。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 开放平台对外 Base URL 是 https://<host>/v1，符合 OpenAI SDK 直接改 baseURL 的习惯。
    # Nest 侧仍挂在 /api 前缀下，这里做一次重写，避免为了一个公开路径去动全局前缀。
    location /v1/ {
        proxy_pass http://infinite_canvas_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace rather than append: API-key IP allowlists must not trust a client-supplied first hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $pass_proto;
        proxy_set_header X-Request-Id $request_id;

        # chat/completions 的 stream:true 是 SSE，缓冲会把逐字下发攒成一次性响应。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 图片同步阻塞、视频轮询都可能长时间挂住连接。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 本机磁盘存储驱动的内部重定向目标：Node 只做鉴权，字节由 nginx 发。
    # internal 保证外部无法直接请求该路径。
    location /internal-files/ {
        internal;
        alias /data/storage/;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
}
