upstream infinite_canvas_api {
    server api:4000;
    keepalive 32;
}

# Behind the host TLS proxy the inner $scheme is http; keep the original proto when present.
map $http_x_forwarded_proto $pass_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 画布数据是较大的 JSON，放宽请求体上限；文件上传另有单独限制。
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://infinite_canvas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pass_proto;
        proxy_set_header X-Request-Id $request_id;

        # 文本生成走 SSE，必须关掉缓冲，否则增量会被攒到最后一次性下发。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 视频任务可能跑很久，读超时按最长任务放宽。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 本机磁盘存储驱动的内部重定向目标：Node 只做鉴权，字节由 nginx 发。
    # internal 保证外部无法直接请求该路径。
    location /internal-files/ {
        internal;
        alias /data/storage/;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
}
