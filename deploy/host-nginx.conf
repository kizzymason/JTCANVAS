# Host TLS terminator for JTCANVAS. Proxies to the docker web container on 127.0.0.1:3000.
# HTTP is redirected to HTTPS. Install to /etc/nginx/sites-available/jtcanvas.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jingtiang.com www.jingtiang.com *.jingtiang.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name jingtiang.com www.jingtiang.com *.jingtiang.com;

    ssl_certificate     /etc/nginx/ssl/jingtiang.com/domain.cert.pem;
    ssl_certificate_key /etc/nginx/ssl/jingtiang.com/private.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
