<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个景甜画布创作工具" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=jtcanvas-black-v1" />
        <title>景甜Canvas AI创作画布</title>
        <script>
            var admin = /^\/admin(?:\/|$)/.test(location.pathname);
            document.documentElement.classList.toggle("gravity", !admin);
            var t = admin ? "light" : "dark";
            try {
                var key = admin ? "infinite-canvas:theme_store" : "jtcanvas:frontend-theme-store";
                var s = JSON.parse(localStorage.getItem(key) || "{}");
                if (s.state && (s.state.theme === "light" || s.state.theme === "dark")) t = s.state.theme;
            } catch (e) {}
            document.documentElement.classList.toggle("dark", t === "dark");
            document.documentElement.style.colorScheme = t;
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
