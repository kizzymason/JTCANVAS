services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: piapi-api:2.0.0
    container_name: piapi-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /data
      DISPLAY: ":99"
      SCREEN_GEOMETRY: 1440x900x24
      IN_CONTAINER: "1"
      NOVNC_URL: /vnc/
    volumes:
      - piapi-data:/data
    ports:
      # Exposed for direct debugging; the UI reaches both through the web container.
      - "3001:3001"
      - "6080:6080"
    # Chromium needs more than the default 64MB of shared memory.
    shm_size: 1gb
    networks:
      - piapi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: piapi-web:2.0.0
    container_name: piapi-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - piapi
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  piapi:
    driver: bridge

volumes:
  piapi-data:
    driver: local
