upstream piapi_api {
    server api:3001;
}

upstream piapi_vnc {
    server api:6080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;

    # The SSE stream must not be buffered or the UI only updates when the
    # response ends, which for an open stream is never.
    location /api/events {
        proxy_pass         http://piapi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass         http://piapi_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # noVNC: the HTML client plus the websocket it upgrades to.
    location /vnc/ {
        proxy_pass         http://piapi_vnc/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /websockify {
        proxy_pass         http://piapi_vnc/websockify;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /assets/ {
        root      /usr/share/nginx/html;
        expires   7d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths must fall back to the SPA shell.
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
